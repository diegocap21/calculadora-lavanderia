</style></head><body><main class="wrap"><header><div><p class="eyebrow">Tu guía Whirlpool</p><h1>¿Qué vas a lavar hoy?</h1></div><p>Agrega tus prendas y recibe una receta exacta de lavado y secado.</p></header><section class="panel"><div class="toolbar"><div><label>Prenda</label><select id="garment"></select></div><div><label>Cantidad</label><input id="qty" type="number" min="1" max="40" value="1"></div><button id="add" class="add">+ Agregar</button></div><div id="items" class="items"></div><details class="custom-builder"><summary>＋ Agregar una prenda diferente</summary><div class="custom-grid"><div><label>Nombre</label><input id="customName" placeholder="Ej. shorts casuales"></div><div><label>Cantidad</label><input id="customQty" type="number" min="1" max="40" value="1"></div><div><label>Material</label><select id="customMaterial"><option value="cotton">Algodón</option><option value="tech">Sintético / técnico</option><option value="denim">Mezclilla</option><option value="wool">Lana / merino</option><option value="unknown">No lo sé</option></select></div><div><label>Grosor</label><select id="customWeight"><option value=".75">Ligero</option><option value="1" selected>Normal</option><option value="1.8">Pesado</option></select></div></div><div class="custom-checks"><label class="check"><input id="customPrint" type="checkbox"> Tiene estampado</label><label class="check"><input id="customZip" type="checkbox"> Tiene cierre</label><label class="check"><input id="customVelcro" type="checkbox"> Tiene velcro</label></div><button id="addCustom" class="custom-submit">Agregar prenda personalizada</button></details><div class="favorites"><select id="favoriteList"></select><button id="loadFavorite">Cargar</button><button id="saveFavorite">☆ Guardar carga</button></div><div class="options"><label class="check"><input id="newItem" type="checkbox"> Prenda nueva</label><label class="check"><input id="dirty" type="checkbox"> Muy sucia</label><label class="check"><input id="dryTogether" type="checkbox"> Secar todo junto</label></div><button id="calculate" class="calculate">Calcular settings</button></section><section class="history-panel"><div class="history-head"><div><p class="eyebrow">Actividad reciente</p><h2>Historial de cargas</h2></div><button id="clearHistory">Borrar historial</button></div><div id="history" class="history-list"></div></section><section id="results" class="results"></section></main><script>
const T={cotton:{name:'Playera de algodón',hint:'Cualquier marca',w:1,g:'cotton',prep:'Voltear al revés si tiene estampado.'},hoodie:{name:'Sudadera de algodón',hint:'Con o sin capucha',w:2.2,g:'cotton',prep:'Voltear; cerrar cierre y aflojar cordones.'},uniqlo:{name:'Playera Uniqlo',hint:'Algodón diario',w:1,g:'cotton',prep:'Voltear al revés.'},carhartt:{name:'Playera Carhartt',hint:'Algodón pesado',w:1.3,g:'cotton',prep:'Voltear; separar si es nueva.'},jersey:{name:'Jersey de fútbol',hint:'Tela técnica',w:.8,g:'tech',prep:'Voltear para proteger logos.'},lululemon:{name:'Pantalón Lululemon',hint:'Tela técnica',w:1.5,g:'tech',prep:'Voltear y cerrar cierres.'},quandary:{name:'Patagonia Quandary',hint:'Nylon / elastano',w:1.4,g:'tech',prep:'Voltear; cerrar cierres y velcros.'},jeans:{name:'Jeans',hint:'Mezclilla pesada',w:2.5,g:'heavy',prep:'Voltear y cerrar cierre y botón.'},underwear:{name:'Ropa interior',hint:'Algodón o sintética',w:.45,g:'light',prep:'Cerrar ganchos, si existen.'},merino:{name:'Calcetines de merino',hint:'Lana merino',w:.38,g:'wool',prep:'Voltear si lo recomienda la etiqueta.'},shirts:{name:'Camisa de cuello / Brooks Brothers',hint:'Algodón o non-iron',w:1.1,g:'shirt',prep:'Desabrochar botones y retirar collarines.'}};
const S={},$=x=>document.querySelector(x),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));Object.entries(T).forEach(([k,v])=>$('#garment').add(new Option(v.name,k)));
function render(){const a=Object.entries(S);$('#items').innerHTML=a.length?a.map(([k,x])=>{x.color=x.color||'unknown';x.fresh=!!x.fresh;return `<div class="item"><div><strong>${esc(x.name)}</strong><small>${esc(x.hint)}</small></div><div class="item-options"><input type="number" min="1" max="40" value="${x.qty}" data-q="${esc(k)}" aria-label="Cantidad"><select data-color="${esc(k)}" aria-label="Color"><option value="unknown" ${x.color==='unknown'?'selected':''}>Color…</option><option value="light" ${x.color==='light'?'selected':''}>Claro</option><option value="dark" ${x.color==='dark'?'selected':''}>Oscuro</option><option value="intense" ${x.color==='intense'?'selected':''}>Intenso</option></select><label class="item-new"><input type="checkbox" data-new="${esc(k)}" ${x.fresh?'checked':''}> Nueva</label></div><button class="remove" data-r="${esc(k)}">×</button></div>`}).join(''):'<div class="empty">Empieza agregando una prenda.</div>'}function add(k,q){q=Math.max(1,Math.min(40,+q||1));S[k]?S[k].qty+=q:S[k]={...(T[k]||{name:k.slice(7),hint:'Prenda personalizada',w:1,g:'custom',prep:'Revisar la etiqueta.'}),qty:q,color:'unknown',fresh:false};render()}$('#add').onclick=()=>{add($('#garment').value,$('#qty').value);$('#qty').value=1};$('#addCustom').onclick=()=>{let n=$('#customName').value.trim();if(!n)return alert('Escribe el nombre de la prenda.');let m=$('#customMaterial').value,w=+$('#customWeight').value,q=Math.max(1,+$('#customQty').value||1),groups={cotton:'cotton',tech:'tech',denim:'heavy',wool:'wool',unknown:'custom'},materials={cotton:'Algodón',tech:'Sintético / técnico',denim:'Mezclilla',wool:'Lana / merino',unknown:'Material desconocido'},thick=w<1?'ligero':w>1?'pesado':'normal',care=[];if($('#customPrint').checked)care.push('voltear al revés para proteger el estampado');if($('#customZip').checked)care.push('cerrar el cierre');if($('#customVelcro').checked)care.push('cerrar el velcro y separar de telas delicadas');if(m==='wool')care.push('preferir detergente const loadMeter=document.createElement('div');loadMeter.className='load-meter';$('.favorites').before(loadMeter);function updateMeter(){let a=Object.values(S),count=a.reduce((n,x)=>n+x.qty,0),score=a.reduce((n,x)=>n+x.w*x.qty,0),size=score<=7?'Small':score<=18?'Medium':'Large',pct=Math.min(100,score/28*100),groups=a.length?smartGroups(a):[],message='';if(score>28)message='La carga parece demasiado llena. Conviene dividirla.';else if(groups.length>1)message=`Conviene dividir esta selección en ${groups.length} cargas.`;loadMeter.innerHTML=`<div class="meter-head"><div><span class="meter-kicker">Carga en tiempo real</span><span class="meter-count">${count} ${count===1?'prenda':'prendas'}</span></div><div class="meter-size"><span class="meter-kicker">Load Size estimado</span><b>${a.length?size:'—'}</b></div></div><div class="meter-track"><div class="meter-fill" style="width:${a.length?pct:0}%"></div></div><div class="meter-scale"><span>Small</span><span>Medium</span><span>Large</span></div><div class="meter-alert ${message?'show':''}">${message}</div>`}new MutationObserver(updateMeter).observe($('#items'),{childList:true,subtree:true});$('#items').addEventListener('change',()=>queueMicrotask(updateMeter));updateMeter();
$('#add').onclick=()=>{let k=$('#garment').value,q=Math.max(1,Math.min(40,+$('#qty').value||1)),id=k+':'+Date.now()+':'+Math.random().toString(36).slice(2,6);S[id]={...T[k],qty:q,color:'unknown',fresh:false};$('#qty').value=1;render()};
const THEME_KEY='lavanderia-tema-v1',themeButton=document.createElement('button');themeButton.className='theme-toggle';themeButton.type='button';document.body.appendChild(themeButton);function setTheme(theme){document.body.dataset.theme=theme;themeButton.textContent=theme==='dark'?'☀':'☾';themeButton.title=theme==='dark'?'Cambiar a modo claro':'Cambiar a modo oscuro';themeButton.setAttribute('aria-label',themeButton.title)}let initialTheme=localStorage.getItem(THEME_KEY)||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');setTheme(initialTheme);themeButton.onclick=()=>{let next=document.body.dataset.theme==='dark'?'light':'dark';localStorage.setItem(THEME_KEY,next);setTheme(next)};
const FK='lavanderia-favoritas-v1',HK='lavanderia-historial-v1';function read(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}}function favRender(){let f=read(FK,{});$('#favoriteList').innerHTML='<option value="">Cargas favoritas…</option>'+Object.keys(f).sort().map(n=>`<option>${esc(n)}</option>`).join('')}favRender();$('#saveFavorite').onclick=()=>{if(!Object.keys(S).length)return alert('Agrega prendas primero.');let n=prompt('Nombre de esta carga:');if(n&&n.trim()){let f=read(FK,{});f[n.trim()]=S;localStorage.setItem(FK,JSON.stringify(f));favRender()}};$('#loadFavorite').onclick=()=>loadState(read(FK,{})[$('#favoriteList').value]);function loadState(x){if(!x)return;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,JSON.parse(JSON.stringify(x)));render();scrollTo({top:0,behavior:'smooth'})}
function dose(z){return z==='Small'?'½ cuchara':z==='Medium'?'¾ de cuchara':'1 cuchara'}function plan(a,together){let score=a.reduce((s,x)=>s+x.w*x.qty,0),size=score<=7?'Small':score<=18?'Medium':'Large',g=new Set(a.map(x=>x.g)),has=x=>g.has(x),tech=has('tech')||has('wool'),heavy=has('heavy'),shirt=has('shirt'),cycle=tech?'Delicates 6':heavy&&!has('cotton')&&!shirt?'Regular 6':'Permanent Press 6',dc='Knits',temp='Low',time=size==='Small'?'30–40 min':size==='Medium'?'40–50 min':'45–55 min',note='Sacar al terminar.';if(tech){dc='Delicate';temp='Ex Low';time='20–30 min';note=together?'Retirar lo que seque antes.':'Ideal: colgar prendas técnicas y merino.'}if(shirt&&!tech){time='10–15 min';note='Colgar para terminar.'}return{size,cycle,dc,temp,time,note,powder:dose(size),names:a.map(x=>`${x.qty} ${x.name}`).join(' · ')}}
function card(p,title,cl=''){return `<article class="card full ${cl}"><h3>${title}</h3>${cl?`<div class="load-summary">${esc(p.names)}</div>`:''}<div class="machine"><div class="machine-top"><span>Lavadora Whirlpool · guía de ciclo</span><span class="on">Lista</span></div><div class="knobs"><div class="knob"><div class="dial"></div><span>Load Size</span><b>${p.size}</b></div><div class="knob"><div class="dial"></div><span>Temperatura</span><b>Cold / Cold</b></div><div class="knob"><div class="dial"></div><span>Ciclo</span><b>${p.cycle}</b></div></div></div><div class="details wash-details"><div class="detail"><span>Extra Rinse</span><b>Off</b></div><div class="detail"><span>Detergente Kirkland</span><b>${p.powder}</b></div></div><div class="dryer-island"><div class="dryer-top"><span class="dryer-brand">Secadora Whirlpool</span><span>Clean Touch · secado</span></div><div class="dryer-controls"><div class="dryer-control"><div class="dryer-dial"></div><span class="dryer-label">Tiempo</span><b class="dryer-value">${p.time}</b></div><div class="dryer-control temp"><div class="dryer-dial"></div><span class="dryer-label">Temperatura</span><b class="dryer-value">${p.temp}</b></div><div class="dryer-cycle"><span>Ciclo recomendado</span><b>${p.dc}</b><div class="dryer-note">Revisa la carga al terminar el tiempo inicial.</div></div></div></div><p class="load-note">${p.note}</p></article>`}
function historySig(state,opts={}){let items=Object.values(state||{}).map(x=>({name:x.name,qty:x.qty,g:x.g,w:x.w,color:x.color||'unknown',fresh:!!x.fresh})).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)));return JSON.stringify({items,dirty:!!opts.dirty,dryTogether:!!opts.dryTogether})}
function historySave(split,plans){let h=read(HK,[]),snap=JSON.parse(JSON.stringify(S)),opts={dirty:$('#dirty').checked,dryTogether:$('#dryTogether').checked},sig=historySig(snap,opts),old=h.find(x=>(x.sig||historySig(x.state,x))===sig),uses=(old?.uses||1)+1;h=h.filter(x=>(x.sig||historySig(x.state,x))!==sig);h.unshift({id:Date.now(),date:new Date().toISOString(),state:snap,dirty:opts.dirty,dryTogether:opts.dryTogether,title:Object.values(snap).map(x=>`${x.qty} ${x.name}`).join(' · '),settings:split?`${plans.length} cargas separadas`:`${plans[0].size} · ${plans[0].cycle} · Cold/Cold`,sig,uses:old?uses:1});localStorage.setItem(HK,JSON.stringify(h.slice(0,20)));historyRender()}
function historyRender(){let raw=read(HK,[]),seen=new Map(),h=[];raw.forEach(x=>{let sig=x.sig||historySig(x.state,x),found=seen.get(sig);if(found)found.uses=(found.uses||1)+(x.uses||1);else{x.sig=sig;x.uses=x.uses||1;seen.set(sig,x);h.push(x)}});if(h.length!==raw.length)localStorage.setItem(HK,JSON.stringify(h.slice(0,20)));$('#history').innerHTML=h.length?h.map(x=>`<div class="history-item"><div><div class="history-title">${esc(x.title)}</div><div class="history-settings">${esc(x.settings)}</div><div class="history-meta">${new Date(x.date).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})}${x.uses>1?` · Usada ${x.uses} veces`:''}</div></div><div class="history-actions"><button data-repeat="${x.id}">Repetir</button><button class="delete" data-delete="${x.id}">×</button></div></div>`).join(''):'<div class="history-empty">Todavía no has calculado ninguna carga.</div>'}historyRender();$('#history').onclick=e=>{let h=read(HK,[]),id=+e.target.dataset.repeat||+e.target.dataset.delete;if(!id)return;if(e.target.dataset.repeat){let x=h.find(y=>y.id===id);loadState(x.state);$('#dirty').checked=x.dirty;$('#dryTogether').checked=x.dryTogether}else{localStorage.setItem(HK,JSON.stringify(h.filter(x=>x.id!==id)));historyRender()}};$('#clearHistory').onclick=()=>{if(confirm('¿Borrar todo el historial?')){localStorage.removeItem(HK);historyRender()}};
function resetCurrent(){Object.keys(S).forEach(k=>delete S[k]);render();$('#qty').value=1;$('#customQty').value=1;$('#customName').value='';$('#customMaterial').value='cotton';$('#customWeight').value='1';$('#newItem').checked=$('#dirty').checked=$('#dryTogether').checked=false;$('#customPrint').checked=$('#customZip').checked=$('#customVelcro').checked=false}
function smartGroups(a){let buckets=[];function colors(list,prefix){if(!list.length)return;let light=list.filter(x=>x.color==='light'),color=list.filter(x=>x.color!=='light');if(light.length&&color.length){buckets.push({items:light,label:prefix+' · colores claros'});buckets.push({items:color,label:prefix+' · oscuros o intensos'})}else buckets.push({items:list,label:prefix})}colors(a.filter(x=>x.fresh),'Prendas nuevas');colors(a.filter(x=>!x.fresh),'Ropa habitual');let final=[];buckets.forEach(b=>{let heavy=b.items.filter(x=>x.g==='heavy'),rest=b.items.filter(x=>x.g!=='heavy'),delicate=rest.some(x=>['tech','wool','shirt'].includes(x.g));if(heavy.length&&delicate){final.push({items:heavy,label:b.label+' · mezclilla'});final.push({items:rest,label:b.label+' · telas delicadas'})}else final.push(b)});return final}
function calculate(){let a=Object.values(S),out=$('#results');if(!a.length){out.className='results show';out.innerHTML='<div class="warning">Agrega al menos una prenda.</div>';return}let groups=smartGroups(a),split=groups.length>1,t=$('#dryTogether').checked,plans=[],body='',summary=a.map(x=>`${x.qty} ${x.name}`).join(' · ');groups.forEach((g,i)=>{let p=plan(g.items,t);plans.push(p);body+=card(p,split?`Carga ${i+1} · ${g.label}`:'Una sola carga',split?'split':'')});let banner=split?'<div class="warning"><b>Separación automática activa.</b> Separamos prendas nuevas, colores claros y telas incompatibles cuando fue necesario.</div>':'';let prep=[...new Set(a.map(x=>x.prep)),'No usar suavizante.'];if(a.some(x=>x.fresh))prep.unshift('Las prendas marcadas como nuevas se lavan separadas durante sus primeras 2 lavadas.');out.innerHTML=`<div class="result-head"><h2>Tu configuración</h2><span class="pill">${split?groups.length+' cargas':'1 carga'}</span></div><div class="load-summary">${esc(summary)}</div>${banner}<div class="grid">${body}<article class="card full"><h3>Antes de lavar</h3><ul>${prep.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article></div>`;out.className='results show';historySave(split,plans);resetCurrent();out.scrollIntoView({behavior:'smooth'})}$('#calculate').onclick=calculate;
$('#results').after($('.history-panel'));
</script></body></html>
