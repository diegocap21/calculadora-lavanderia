<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de lavandería</title>
  <style>
    :root{--ink:#17342e;--muted:#687b76;--paper:#f6f4ed;--card:#fff;--line:#dbe3df;--mint:#dceee5;--green:#1d6a55;--orange:#e7834a;--warn:#fff3df;--shadow:0 18px 55px rgba(23,52,46,.10)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#e2efe9 0,transparent 33%),var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1080px,calc(100% - 28px));margin:0 auto;padding:38px 0 64px}header{display:flex;gap:24px;justify-content:space-between;align-items:end;margin-bottom:24px}.eyebrow{margin:0 0 8px;color:var(--green);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px}h1{font-family:Georgia,serif;font-size:clamp(35px,6vw,64px);line-height:.95;letter-spacing:-.04em;margin:0;max-width:690px}header p{max-width:330px;margin:0;color:var(--muted)}.panel{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px}.toolbar{display:grid;grid-template-columns:1.5fr 1fr auto;gap:12px;margin-bottom:18px}label{font-size:13px;font-weight:750;display:block;margin:0 0 7px}select,input,button{font:inherit}select,input[type=number],input[type=text]{width:100%;height:46px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 12px;color:var(--ink);outline:none}select:focus,input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,106,85,.12)}button{border:0;border-radius:12px;cursor:pointer;font-weight:800}.add{height:46px;align-self:end;background:var(--mint);color:var(--green);padding:0 20px}.items{display:grid;gap:9px}.empty{border:1px dashed #bdcbc5;border-radius:16px;padding:28px;text-align:center;color:var(--muted)}.item{display:grid;grid-template-columns:1fr 90px 42px;gap:10px;align-items:center;padding:10px 10px 10px 15px;background:#fbfcfa;border:1px solid var(--line);border-radius:14px}.item strong{display:block}.item small{color:var(--muted)}.remove{width:40px;height:40px;background:transparent;color:#8b4f41;font-size:22px}.options{display:flex;gap:22px;flex-wrap:wrap;margin:20px 0}.check{display:flex;gap:9px;align-items:center;font-size:14px;font-weight:650}.check input{accent-color:var(--green);width:18px;height:18px}.calculate{width:100%;height:58px;background:var(--green);color:#fff;font-size:17px;box-shadow:0 9px 22px rgba(29,106,85,.24)}.calculate:hover{filter:brightness(.96)}.results{margin-top:22px;display:none}.results.show{display:block}.result-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:15px}.result-head h2{font-family:Georgia,serif;font-size:30px;margin:0}.pill{background:var(--mint);color:var(--green);padding:7px 11px;border-radius:999px;font-weight:800;font-size:12px}.warning{background:var(--warn);border:1px solid #efd5ac;border-radius:15px;padding:13px 15px;margin-bottom:14px;color:#714b28}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:18px;padding:17px;background:#fff}.card h3{margin:0 0 13px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--green)}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.setting span{display:block;color:var(--muted);font-size:12px}.setting b{display:block;margin-top:2px}.card ul{margin:0;padding-left:19px}.card li+li{margin-top:7px}.full{grid-column:1/-1}.note{color:var(--muted);font-size:13px;margin:16px 4px 0}.custom-row{margin-top:14px;display:grid;grid-template-columns:1fr 100px auto;gap:10px}.custom-add{padding:0 16px;background:#edf1ef;color:var(--ink)}@media(max-width:700px){.wrap{padding-top:24px}header{display:block}header p{margin-top:16px}.toolbar{grid-template-columns:1fr 90px}.toolbar .add{grid-column:1/-1}.grid{grid-template-columns:1fr}.full{grid-column:auto}.custom-row{grid-template-columns:1fr 80px}.custom-add{grid-column:1/-1;height:44px}.panel{padding:15px;border-radius:19px}.item{grid-template-columns:1fr 74px 38px}.options{gap:12px}}
    .favorites{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-top:10px}.favorites button{padding:0 15px;background:#edf1ef;color:var(--ink)}.split-title{font-family:Georgia,serif;font-size:24px;margin:22px 0 10px}.split-card{border-left:5px solid var(--orange)}
    @media(max-width:700px){.favorites{grid-template-columns:1fr 1fr}.favorites select{grid-column:1/-1}.favorites button{height:44px}}
  </style>
</head>
<body>
<main class="wrap">
  <header><div><p class="eyebrow">Tu guía Whirlpool</p><h1>¿Qué vas a lavar hoy?</h1></div><p>Agrega prendas, indica cuántas y recibe los ajustes exactos de lavado y secado.</p></header>
  <section class="panel" aria-label="Calculadora">
    <div class="toolbar">
      <div><label for="garment">Prenda</label><select id="garment"></select></div>
      <div><label for="qty">Cantidad</label><input id="qty" type="number" min="1" max="40" value="1" inputmode="numeric"></div>
      <button class="add" id="add" type="button">+ Agregar</button>
    </div>
    <div id="items" class="items"><div class="empty">Empieza agregando una prenda.</div></div>
    <div class="custom-row"><input id="customName" type="text" placeholder="Otra prenda (opcional)" aria-label="Nombre de otra prenda"><input id="customQty" type="number" min="1" max="40" value="1" aria-label="Cantidad"><button id="addCustom" class="custom-add" type="button">Agregar otra</button></div>
    <div class="favorites"><select id="favoriteList" aria-label="Cargas favoritas"><option value="">Cargas favoritas…</option></select><button id="loadFavorite" type="button">Cargar</button><button id="saveFavorite" type="button">☆ Guardar carga</button></div>
    <div class="options">
      <label class="check"><input id="newItem" type="checkbox"> Hay una prenda nueva (1.ª o 2.ª lavada)</label>
      <label class="check"><input id="dirty" type="checkbox"> Carga muy sudada o sucia</label>
      <label class="check"><input id="dryTogether" type="checkbox"> Quiero secar todo junto</label>
    </div>
    <button id="calculate" class="calculate" type="button">Calcular settings</button>
  </section>
  <section id="results" class="results" aria-live="polite"></section>
</main>
<script>
const TYPES={
 cotton:{name:'Playera de algodón',hint:'Algodón / cualquier marca',weight:1,group:'cotton',prep:['Voltear al revés si tiene estampado, logo o color oscuro.']},
 hoodie:{name:'Sudadera de algodón',hint:'Algodón grueso / con o sin capucha',weight:2.2,group:'cotton',prep:['Voltear al revés para proteger el exterior.','Cerrar el cierre si tiene y aflojar los cordones de la capucha.']},
 uniqlo:{name:'Playera Uniqlo',hint:'Algodón / uso diario',weight:1,group:'cotton',prep:['Voltear al revés, sobre todo colores oscuros o estampados.']},
 carhartt:{name:'Playera Carhartt',hint:'Algodón pesado',weight:1.3,group:'cotton',prep:['Voltear al revés; puede soltar tinte si es nueva.']},
 jersey:{name:'Jersey de fútbol',hint:'Tela técnica y estampados',weight:.8,group:'tech',prep:['Voltear al revés para proteger nombre, número y patrocinadores.']},
 lululemon:{name:'Pantalón Lululemon',hint:'Tela técnica elástica',weight:1.5,group:'tech',prep:['Voltear al revés y cerrar cierres.']},
 quandary:{name:'Patagonia Quandary',hint:'Nylon / elastano',weight:1.4,group:'tech',prep:['Voltear al revés; cerrar cierres, botones y velcros.']},
 jeans:{name:'Jeans',hint:'Mezclilla pesada',weight:2.5,group:'heavy',prep:['Voltear al revés y cerrar cierre y botón.']},
 underwear:{name:'Ropa interior',hint:'Algodón o sintética',weight:.45,group:'light',prep:['Cerrar ganchos o cierres, si los hay.']},
 merino:{name:'Calcetines de merino',hint:'Lana merino',weight:.38,group:'wool',prep:['Voltear al revés si la etiqueta lo recomienda.']},
 shirts:{name:'Camisa de cuello / Brooks Brothers',hint:'Algodón o non-iron',weight:1.1,group:'shirt',prep:['Desabrochar botones y retirar collarines removibles.','Separar de jeans y prendas con cierres que puedan rozarla.']}
};
const state={};
const garment=document.querySelector('#garment');
Object.entries(TYPES).forEach(([k,v])=>garment.add(new Option(v.name,k)));
const esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function render(){const el=document.querySelector('#items'),rows=Object.entries(state);if(!rows.length){el.innerHTML='<div class="empty">Empieza agregando una prenda.</div>';return}el.innerHTML=rows.map(([k,x])=>`<div class="item"><div><strong>${esc(x.name)}</strong><small>${esc(x.hint||'Prenda personalizada')}</small></div><input type="number" min="1" max="40" value="${x.qty}" data-qty="${esc(k)}" aria-label="Cantidad de ${esc(x.name)}"><button class="remove" data-remove="${esc(k)}" aria-label="Quitar ${esc(x.name)}">×</button></div>`).join('')}
function add(k,q){q=Math.max(1,Math.min(40,Number(q)||1));if(state[k])state[k].qty+=q;else state[k]={...(TYPES[k]||{name:k.slice(7),hint:'Se calculará como ropa diaria',weight:1,group:'custom',prep:['Revisar la etiqueta de cuidado antes de lavar.']}),qty:q};render()}
document.querySelector('#add').onclick=()=>{const qty=document.querySelector('#qty');add(garment.value,qty.value);qty.value=1};
document.querySelector('#addCustom').onclick=()=>{const n=document.querySelector('#customName').value.trim(),qty=document.querySelector('#customQty');if(n){add('custom:'+n,qty.value);document.querySelector('#customName').value='';qty.value=1}};
document.querySelector('#items').addEventListener('click',e=>{const k=e.target.dataset.remove;if(k){delete state[k];render()}});
document.querySelector('#items').addEventListener('change',e=>{const k=e.target.dataset.qty;if(k)state[k].qty=Math.max(1,Math.min(40,Number(e.target.value)||1))});
const FAVORITES_KEY='lavanderia-favoritas-v1';
function getFavorites(){try{return JSON.parse(localStorage.getItem(FAVORITES_KEY)||'{}')}catch{return {}}}
function renderFavorites(){const list=document.querySelector('#favoriteList'),fav=getFavorites();list.innerHTML='<option value="">Cargas favoritas…</option>'+Object.keys(fav).sort().map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}
document.querySelector('#saveFavorite').onclick=()=>{if(!Object.keys(state).length)return alert('Agrega prendas antes de guardar.');const name=prompt('Nombre de esta carga favorita:');if(!name||!name.trim())return;const fav=getFavorites();fav[name.trim()]=JSON.parse(JSON.stringify(state));localStorage.setItem(FAVORITES_KEY,JSON.stringify(fav));renderFavorites();document.querySelector('#favoriteList').value=name.trim()};
document.querySelector('#loadFavorite').onclick=()=>{const name=document.querySelector('#favoriteList').value;if(!name)return;const saved=getFavorites()[name];if(!saved)return;Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,JSON.parse(JSON.stringify(saved)));render()};
renderFavorites();
function dose(size,liquid,dirty,merino){if(liquid){if(merino)return dirty?'2 cucharadas (30 mL)':'1 cucharada (15 mL)';return size==='Small'?'1 cucharada (15 mL)':size==='Medium'?(dirty?'2 cucharadas (30 mL)':'1½–2 cucharadas (20–30 mL)'):'2 cucharadas (30 mL)'}return size==='Small'?'½ cuchara':size==='Medium'?'¾ de cuchara':'1 cuchara'}
function calculate(){const entries=Object.values(state);if(!entries.length){document.querySelector('#results').className='results show';document.querySelector('#results').innerHTML='<div class="warning">Agrega al menos una prenda para calcular la carga.</div>';return}const score=entries.reduce((s,x)=>s+x.weight*x.qty,0);const size=score<=7?'Small':score<=18?'Medium':'Large';const groups=new Set(entries.map(x=>x.group));const has=g=>groups.has(g);const tech=has('tech')||has('wool');const heavy=has('heavy');const shirts=has('shirt');const merino=has('wool');const dirty=document.querySelector('#dirty').checked;const fresh=document.querySelector('#newItem').checked;let cycle=tech?'Delicates 6':heavy&&!has('cotton')&&!shirts?'Regular 6':'Permanent Press 6';let warnings=[];if(heavy&&(tech||shirts))warnings.push('Mejor en dos cargas: separa los jeans de la ropa técnica y de las camisas. Si hoy van juntos, usa Permanent Press 6 y revisa que ningún cierre roce telas delicadas.'),cycle='Permanent Press 6';if(merino&&heavy)warnings.push('Separa los calcetines merino de los jeans para evitar fricción y calor innecesarios.');if(fresh)warnings.push('Lava la prenda nueva separada o solo con colores similares durante sus primeras 2 lavadas.');if(score>28)warnings.push('La carga parece muy llena. Divide en dos si la ropa no puede moverse libremente.');let dryCycle='Knits',temp='Low',time=size==='Small'?'30–40 min':size==='Medium'?'40–50 min':'45–55 min',air='Sacar al terminar para reducir arrugas.';if(tech||merino){dryCycle='Delicate';temp='Ex Low';time='20–30 min';air='Ideal: colgar jerseys, Lululemon, Quandary y merino. Si usas secadora, retíralos apenas estén secos.'}if(shirts&&!tech){dryCycle='Knits';temp='Low';time='10–15 min';air='Después, colgar inmediatamente para terminar de secar. Ciclo completo: 20–30 min máximo.'}if(heavy&&!tech&&!shirts){time='35–40 min';air='Para que duren más: 20–30 min en Low y terminar colgados.'}const prep=[...new Set(entries.flatMap(x=>x.prep)),'Separar colores claros y oscuros; no usar suavizante.'];if(fresh)prep.unshift('Separar la prenda nueva o lavar solo con colores similares.');const liquid=dose(size,true,dirty,merino);const powder=dose(size,false,dirty,merino);const recommended=merino?'Mas Bebé líquido':'Cualquiera de los dos';const names=entries.map(x=>`${x.qty} ${x.name}`).join(' · ');const html=`<div class="result-head"><h2>Tu configuración</h2><span class="pill">${esc(size)} · ${Math.round(score)} pts</span></div>${warnings.map(w=>`<div class="warning">${esc(w)}</div>`).join('')}<div class="grid"><article class="card"><h3>Lavado</h3><div class="settings"><div class="setting"><span>Load Size</span><b>${size}</b></div><div class="setting"><span>Temperatura</span><b>Cold / Cold</b></div><div class="setting"><span>Ciclo</span><b>${cycle}</b></div><div class="setting"><span>Extra Rinse</span><b>Off</b></div></div></article><article class="card"><h3>Detergente</h3><div class="settings"><div class="setting"><span>Kirkland polvo</span><b>${powder}</b></div><div class="setting"><span>Mas Bebé líquido</span><b>${liquid}</b></div></div><p class="note">Preferencia: ${recommended}. No uses ambos.</p></article><article class="card"><h3>Antes de lavar</h3><ul>${prep.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article><article class="card"><h3>Secado</h3><div class="settings"><div class="setting"><span>Ciclo</span><b>${dryCycle}</b></div><div class="setting"><span>Temperatura</span><b>${temp}</b></div><div class="setting"><span>Tiempo inicial</span><b>${time}</b></div></div><p class="note">${air}</p></article><article class="card full"><h3>Carga calculada</h3><div>${esc(names)}</div></article></div><p class="note">Esta guía prioriza la duración de la ropa. La etiqueta de cada prenda siempre tiene prioridad.</p>`;const out=document.querySelector('#results');out.innerHTML=html;out.className='results show';out.scrollIntoView({behavior:'smooth',block:'start'})}
function makePlan(entries,dryTogether){
 const score=entries.reduce((s,x)=>s+x.weight*x.qty,0),size=score<=7?'Small':score<=18?'Medium':'Large',groups=new Set(entries.map(x=>x.group)),has=g=>groups.has(g),tech=has('tech')||has('wool'),heavy=has('heavy'),shirts=has('shirt'),merino=has('wool'),dirty=document.querySelector('#dirty').checked;
 let cycle=tech?'Delicates 6':heavy&&!has('cotton')&&!shirts?'Regular 6':'Permanent Press 6',dryCycle='Knits',temp='Low',time=size==='Small'?'30–40 min':size==='Medium'?'40–50 min':'45–55 min',air='Sacar al terminar para reducir arrugas.';
 if(tech){dryCycle='Delicate';temp='Ex Low';time='20–30 min';air=dryTogether?'Usa el ajuste de la prenda más delicada y retira las piezas que sequen antes.':'Ideal: colgar jerseys, Lululemon, Quandary y merino.'}
 if(shirts&&!tech){dryCycle='Knits';temp='Low';time='10–15 min';air='Colgar inmediatamente para terminar de secar.'}
 if(heavy&&!tech&&!shirts){time='35–40 min';air='Para reducir desgaste: 20–30 min en Low y terminar colgados.'}
 return {score,size,cycle,dryCycle,temp,time,air,merino,liquid:dose(size,true,dirty,merino),powder:dose(size,false,dirty,merino),names:entries.map(x=>`${x.qty} ${x.name}`).join(' · ')};
}
function planCard(p,title,split=false){return `<article class="card full ${split?'split-card':''}"><h3>${esc(title)}</h3><div class="settings"><div class="setting"><span>Prendas</span><b>${esc(p.names)}</b></div><div class="setting"><span>Load Size</span><b>${p.size}</b></div><div class="setting"><span>Temperatura</span><b>Cold / Cold</b></div><div class="setting"><span>Ciclo / Extra Rinse</span><b>${p.cycle} · Off</b></div><div class="setting"><span>Kirkland</span><b>${p.powder}</b></div><div class="setting"><span>Mas Bebé</span><b>${p.liquid}</b></div><div class="setting"><span>Secado</span><b>${p.dryCycle} · ${p.temp}</b></div><div class="setting"><span>Tiempo inicial</span><b>${p.time}</b></div></div><p class="note">${esc(p.air)} ${p.merino?'Preferencia de detergente: Mas Bebé líquido.':'Usa solo uno de los dos detergentes.'}</p></article>`}
function calculateV2(){
 const entries=Object.values(state),out=document.querySelector('#results');if(!entries.length){out.className='results show';out.innerHTML='<div class="warning">Agrega al menos una prenda para calcular la carga.</div>';return}
 const fresh=document.querySelector('#newItem').checked,dryTogether=document.querySelector('#dryTogether').checked,groups=new Set(entries.map(x=>x.group)),mustSplit=groups.has('heavy')&&(groups.has('tech')||groups.has('wool')||groups.has('shirt'));
 const prep=[...new Set(entries.flatMap(x=>x.prep)),'Separar colores claros y oscuros; no usar suavizante.'];if(fresh)prep.unshift('Lavar la prenda nueva separada o solo con colores similares durante sus primeras 2 lavadas.');
 let body='',banner='';
 if(mustSplit){const heavy=entries.filter(x=>x.group==='heavy'),care=entries.filter(x=>['tech','wool','shirt'].includes(x.group)),daily=entries.filter(x=>!heavy.includes(x)&&!care.includes(x));banner='<div class="warning"><b>Conviene dividir esta selección.</b> Los jeans pueden rozar o desgastar las telas técnicas, la lana y las camisas.</div><h3 class="split-title">Plan recomendado: cargas separadas</h3>';body+=planCard(makePlan(heavy,dryTogether),'Carga 1 · Jeans',true);if(care.length)body+=planCard(makePlan(care,dryTogether),'Carga 2 · Prendas delicadas',true);if(daily.length)body+=planCard(makePlan(daily,dryTogether),'Carga 3 · Ropa diaria',true)}else body=planCard(makePlan(entries,dryTogether),'Una sola carga');
 const dryNote=dryTogether?'<div class="warning">Secado conjunto activado: la recomendación usa la temperatura de la prenda más delicada. Revisa a mitad del ciclo y saca lo que ya esté seco.</div>':'';
 out.innerHTML=`<div class="result-head"><h2>Tu configuración</h2><span class="pill">${mustSplit?'Separación automática':'1 carga'}</span></div>${banner}${dryNote}<div class="grid">${body}<article class="card full"><h3>Antes de lavar</h3><ul>${prep.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article></div><p class="note">Esta guía prioriza la duración de la ropa. La etiqueta de cada prenda siempre tiene prioridad.</p>`;out.className='results show';out.scrollIntoView({behavior:'smooth',block:'start'});
}
document.querySelector('#calculate').onclick=calculateV2;
</script>
</body>
</html>
