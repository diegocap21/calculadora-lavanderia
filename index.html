<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de lavandería</title><style>
.custom-builder{margin-top:13px;border:1px solid var(--line);border-radius:15px;background:#fbfcf9}.custom-builder summary{padding:14px 16px;cursor:pointer;color:var(--green);font-weight:850;list-style:none}.custom-builder summary::-webkit-details-marker{display:none}.custom-builder[open] summary{border-bottom:1px solid var(--line)}.custom-grid{display:grid;grid-template-columns:1.4fr .6fr 1fr 1fr;gap:10px;padding:15px 15px 8px}.custom-checks{display:flex;gap:18px;flex-wrap:wrap;padding:4px 15px 13px}.custom-submit{height:46px;margin:0 15px 15px;padding:0 17px;background:var(--mint);color:var(--green)}@media(max-width:700px){.custom-grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.custom-grid{grid-template-columns:1fr}}
:root{--ink:#18362f;--muted:#70807a;--cream:#f7f2e8;--paper:#fffdf8;--green:#1d6a55;--mint:#dceee5;--terra:#e47e48;--line:#d8dfdb;--warn:#fff1da;--shadow:0 20px 55px #18362f1c}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 0,#dfede6 0,transparent 31%),var(--cream)}body:before{content:"";position:fixed;width:250px;height:250px;right:-95px;top:90px;border:38px solid #e47e4817;border-radius:50%;z-index:-1}.wrap{width:min(1080px,calc(100% - 28px));margin:auto;padding:38px 0 70px}header{display:flex;justify-content:space-between;align-items:end;gap:28px;margin-bottom:24px}.eyebrow{margin:0 0 7px;color:var(--green);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{font:700 clamp(38px,6vw,66px)/.95 Georgia,serif;letter-spacing:-.045em;margin:0}header>p{max-width:310px;margin:0;color:var(--muted)}.panel,.history-panel{background:#fffdf8f2;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.toolbar{display:grid;grid-template-columns:1.5fr 1fr auto;gap:12px;margin-bottom:16px}label{display:block;margin:0 0 7px;font-size:13px;font-weight:800}input,select,button{font:inherit}select,input[type=number],input[type=text]{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:white;color:var(--ink)}button{border:0;border-radius:12px;cursor:pointer;font-weight:850}.add{height:46px;align-self:end;padding:0 20px;background:var(--mint);color:var(--green)}.items{display:grid;gap:9px}.empty,.history-empty{padding:25px;text-align:center;border:1px dashed #bccbc5;border-radius:15px;color:var(--muted)}.item{display:grid;grid-template-columns:1fr 88px 42px;gap:10px;align-items:center;padding:10px 10px 10px 15px;background:#fbfcf9;border:1px solid var(--line);border-radius:14px}.item strong,.item small{display:block}.item small{color:var(--muted)}.remove{width:40px;height:40px;background:transparent;color:#914d3c;font-size:22px}.custom,.favorites{display:grid;grid-template-columns:1fr 100px auto;gap:10px;margin-top:11px}.favorites{grid-template-columns:1fr auto auto}.custom button,.favorites button{padding:0 16px;background:#edf1ef;color:var(--ink)}.options{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}.check{display:flex;gap:8px;align-items:center;font-size:14px}.check input{width:18px;height:18px;accent-color:var(--green)}.calculate{width:100%;height:59px;background:var(--green);color:white;font-size:17px;box-shadow:0 10px 22px #1d6a5538}.history-panel{margin-top:18px;box-shadow:none}.history-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:13px}.history-head h2{margin:0;font:700 27px Georgia,serif}.history-head button{padding:9px 13px;background:#f1eee7;color:#795345}.history-list{display:grid;gap:9px}.history-item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px;border:1px solid var(--line);border-radius:15px;background:white}.history-title{font-weight:850}.history-meta,.history-settings{margin-top:3px;color:var(--muted);font-size:12px}.history-actions{display:flex;gap:7px;align-items:center}.history-actions button{padding:8px 11px;background:var(--mint);color:var(--green)}.history-actions .delete{background:#f7ece8;color:#8b4b39}.results{display:none;margin-top:22px}.results.show{display:block}.result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.result-head h2{margin:0;font:700 31px Georgia,serif}.pill{padding:7px 12px;border-radius:99px;background:var(--mint);color:var(--green);font-size:12px;font-weight:850}.warning{margin-bottom:13px;padding:14px 16px;border-radius:14px;background:var(--warn);border:1px solid #efd4a7;color:#714924}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:17px;background:var(--paper);border:1px solid var(--line);border-radius:19px}.full{grid-column:1/-1}.split{border-left:5px solid var(--terra)}.card h3{margin:0 0 13px;color:var(--green);font-size:13px;letter-spacing:.09em;text-transform:uppercase}.machine{padding:18px;margin-bottom:14px;border:1px solid #d1cabd;border-radius:18px;background:linear-gradient(145deg,#f5efe4,#e5dfd3);box-shadow:inset 0 2px white,0 8px 18px #372f2619}.machine-top{display:flex;justify-content:space-between;margin-bottom:15px;color:#77756c;font-size:10px;font-weight:900;letter-spacing:.13em}.on:before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#619c69;box-shadow:0 0 0 4px #619c6926}.knobs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.knob{text-align:center}.dial{--t:0deg;position:relative;width:90px;height:90px;margin:0 auto 8px;border:1px solid #b9b1a4;border-radius:50%;background:radial-gradient(circle at 36% 28%,#fff 0 8%,#eee8dd 40%,#cac2b5 72%,#9e978c 74%,#e5dfd4 79%);box-shadow:0 8px 12px #372f2630}.knob:first-child .dial{--t:-42deg}.knob:last-child .dial{--t:42deg}.dial:before{content:"";position:absolute;z-index:2;width:3px;height:28px;left:calc(50% - 1px);top:9px;background:var(--terra);transform:rotate(var(--t));transform-origin:50% 36px}.dial:after{content:"";position:absolute;inset:26px;border:1px solid #c6beb1;border-radius:50%;background:#e8e1d6}.knob span,.detail span{display:block;color:#77756c;font-size:9px;font-weight:850;letter-spacing:.07em;text-transform:uppercase}.knob b,.detail b{display:block;margin-top:2px;font-size:13px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.detail{padding:10px;border:1px solid #ded7ca;border-radius:11px;background:#fcfaf5}.note{margin:12px 3px 0;color:var(--muted);font-size:13px}.card ul{margin:0;padding-left:19px}.split-title{font:700 24px Georgia,serif}@media(max-width:700px){.wrap{padding-top:24px}header{display:block}header>p{margin-top:15px}.toolbar{grid-template-columns:1fr 85px}.toolbar .add{grid-column:1/-1}.custom{grid-template-columns:1fr 80px}.custom button{grid-column:1/-1;height:44px}.favorites{grid-template-columns:1fr 1fr}.favorites select{grid-column:1/-1}.favorites button{height:44px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.panel,.history-panel{padding:15px}.history-item{grid-template-columns:1fr}.history-actions{justify-content:flex-start}}@media(max-width:500px){.knobs{gap:3px}.dial{width:70px;height:70px}.dial:before{height:21px;transform-origin:50% 28px}.dial:after{inset:20px}.details{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header><div><p class="eyebrow">Tu guía Whirlpool</p><h1>¿Qué vas a lavar hoy?</h1></div><p>Agrega tus prendas y recibe una receta exacta de lavado y secado.</p></header><section class="panel"><div class="toolbar"><div><label>Prenda</label><select id="garment"></select></div><div><label>Cantidad</label><input id="qty" type="number" min="1" max="40" value="1"></div><button id="add" class="add">+ Agregar</button></div><div id="items" class="items"></div><details class="custom-builder"><summary>＋ Agregar una prenda diferente</summary><div class="custom-grid"><div><label>Nombre</label><input id="customName" placeholder="Ej. shorts casuales"></div><div><label>Cantidad</label><input id="customQty" type="number" min="1" max="40" value="1"></div><div><label>Material</label><select id="customMaterial"><option value="cotton">Algodón</option><option value="tech">Sintético / técnico</option><option value="denim">Mezclilla</option><option value="wool">Lana / merino</option><option value="unknown">No lo sé</option></select></div><div><label>Grosor</label><select id="customWeight"><option value=".75">Ligero</option><option value="1" selected>Normal</option><option value="1.8">Pesado</option></select></div></div><div class="custom-checks"><label class="check"><input id="customPrint" type="checkbox"> Tiene estampado</label><label class="check"><input id="customZip" type="checkbox"> Tiene cierre</label><label class="check"><input id="customVelcro" type="checkbox"> Tiene velcro</label></div><button id="addCustom" class="custom-submit">Agregar prenda personalizada</button></details><div class="favorites"><select id="favoriteList"></select><button id="loadFavorite">Cargar</button><button id="saveFavorite">☆ Guardar carga</button></div><div class="options"><label class="check"><input id="newItem" type="checkbox"> Prenda nueva</label><label class="check"><input id="dirty" type="checkbox"> Muy sucia</label><label class="check"><input id="dryTogether" type="checkbox"> Secar todo junto</label></div><button id="calculate" class="calculate">Calcular settings</button></section><section class="history-panel"><div class="history-head"><div><p class="eyebrow">Actividad reciente</p><h2>Historial de cargas</h2></div><button id="clearHistory">Borrar historial</button></div><div id="history" class="history-list"></div></section><section id="results" class="results"></section></main><script>
const T={cotton:{name:'Playera de algodón',hint:'Cualquier marca',w:1,g:'cotton',prep:'Voltear al revés si tiene estampado.'},hoodie:{name:'Sudadera de algodón',hint:'Con o sin capucha',w:2.2,g:'cotton',prep:'Voltear; cerrar cierre y aflojar cordones.'},uniqlo:{name:'Playera Uniqlo',hint:'Algodón diario',w:1,g:'cotton',prep:'Voltear al revés.'},carhartt:{name:'Playera Carhartt',hint:'Algodón pesado',w:1.3,g:'cotton',prep:'Voltear; separar si es nueva.'},jersey:{name:'Jersey de fútbol',hint:'Tela técnica',w:.8,g:'tech',prep:'Voltear para proteger logos.'},lululemon:{name:'Pantalón Lululemon',hint:'Tela técnica',w:1.5,g:'tech',prep:'Voltear y cerrar cierres.'},quandary:{name:'Patagonia Quandary',hint:'Nylon / elastano',w:1.4,g:'tech',prep:'Voltear; cerrar cierres y velcros.'},jeans:{name:'Jeans',hint:'Mezclilla pesada',w:2.5,g:'heavy',prep:'Voltear y cerrar cierre y botón.'},underwear:{name:'Ropa interior',hint:'Algodón o sintética',w:.45,g:'light',prep:'Cerrar ganchos, si existen.'},merino:{name:'Calcetines de merino',hint:'Lana merino',w:.38,g:'wool',prep:'Voltear si lo recomienda la etiqueta.'},shirts:{name:'Camisa de cuello / Brooks Brothers',hint:'Algodón o non-iron',w:1.1,g:'shirt',prep:'Desabrochar botones y retirar collarines.'}};
const S={},$=x=>document.querySelector(x),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));Object.entries(T).forEach(([k,v])=>$('#garment').add(new Option(v.name,k)));
function render(){const a=Object.entries(S);$('#items').innerHTML=a.length?a.map(([k,x])=>`<div class="item"><div><strong>${esc(x.name)}</strong><small>${esc(x.hint)}</small></div><input type="number" min="1" max="40" value="${x.qty}" data-q="${esc(k)}"><button class="remove" data-r="${esc(k)}">×</button></div>`).join(''):'<div class="empty">Empieza agregando una prenda.</div>'}function add(k,q){q=Math.max(1,Math.min(40,+q||1));S[k]?S[k].qty+=q:S[k]={...(T[k]||{name:k.slice(7),hint:'Prenda personalizada',w:1,g:'custom',prep:'Revisar la etiqueta.'}),qty:q};render()}$('#add').onclick=()=>{add($('#garment').value,$('#qty').value);$('#qty').value=1};$('#addCustom').onclick=()=>{let n=$('#customName').value.trim();if(!n)return alert('Escribe el nombre de la prenda.');let m=$('#customMaterial').value,w=+$('#customWeight').value,q=Math.max(1,+$('#customQty').value||1),groups={cotton:'cotton',tech:'tech',denim:'heavy',wool:'wool',unknown:'custom'},materials={cotton:'Algodón',tech:'Sintético / técnico',denim:'Mezclilla',wool:'Lana / merino',unknown:'Material desconocido'},thick=w<1?'ligero':w>1?'pesado':'normal',care=[];if($('#customPrint').checked)care.push('voltear al revés para proteger el estampado');if($('#customZip').checked)care.push('cerrar el cierre');if($('#customVelcro').checked)care.push('cerrar el velcro y separar de telas delicadas');if(m==='wool')care.push('preferir detergente líquido y secado al aire');if(m==='tech')care.push('no usar suavizante');if(m==='unknown')care.push('revisar la etiqueta antes de lavar');let k='custom:'+n.toLowerCase()+':'+m+':'+w;if(S[k])S[k].qty+=q;else S[k]={name:n,hint:materials[m]+' · '+thick,w,g:groups[m],prep:care.length?care.join('; ')+'.':'Revisar la etiqueta antes de lavar.',qty:q};$('#customName').value='';$('#customQty').value=1;$('#customPrint').checked=$('#customZip').checked=$('#customVelcro').checked=false;render()};$('#items').onclick=e=>{if(e.target.dataset.r){delete S[e.target.dataset.r];render()}};$('#items').onchange=e=>{if(e.target.dataset.q)S[e.target.dataset.q].qty=Math.max(1,+e.target.value||1)};render();
const FK='lavanderia-favoritas-v1',HK='lavanderia-historial-v1';function read(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}}function favRender(){let f=read(FK,{});$('#favoriteList').innerHTML='<option value="">Cargas favoritas…</option>'+Object.keys(f).sort().map(n=>`<option>${esc(n)}</option>`).join('')}favRender();$('#saveFavorite').onclick=()=>{if(!Object.keys(S).length)return alert('Agrega prendas primero.');let n=prompt('Nombre de esta carga:');if(n&&n.trim()){let f=read(FK,{});f[n.trim()]=S;localStorage.setItem(FK,JSON.stringify(f));favRender()}};$('#loadFavorite').onclick=()=>loadState(read(FK,{})[$('#favoriteList').value]);function loadState(x){if(!x)return;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,JSON.parse(JSON.stringify(x)));render();scrollTo({top:0,behavior:'smooth'})}
function dose(z){return z==='Small'?'½ cuchara':z==='Medium'?'¾ de cuchara':'1 cuchara'}function plan(a,together){let score=a.reduce((s,x)=>s+x.w*x.qty,0),size=score<=7?'Small':score<=18?'Medium':'Large',g=new Set(a.map(x=>x.g)),has=x=>g.has(x),tech=has('tech')||has('wool'),heavy=has('heavy'),shirt=has('shirt'),cycle=tech?'Delicates 6':heavy&&!has('cotton')&&!shirt?'Regular 6':'Permanent Press 6',dc='Knits',temp='Low',time=size==='Small'?'30–40 min':size==='Medium'?'40–50 min':'45–55 min',note='Sacar al terminar.';if(tech){dc='Delicate';temp='Ex Low';time='20–30 min';note=together?'Retirar lo que seque antes.':'Ideal: colgar prendas técnicas y merino.'}if(shirt&&!tech){time='10–15 min';note='Colgar para terminar.'}return{size,cycle,dc,temp,time,note,powder:dose(size),names:a.map(x=>`${x.qty} ${x.name}`).join(' · ')}}
function card(p,title,cl=''){return `<article class="card full ${cl}"><h3>${title}</h3><div class="machine"><div class="machine-top"><span>Whirlpool · guía de ciclo</span><span class="on">Lista</span></div><div class="knobs"><div class="knob"><div class="dial"></div><span>Load Size</span><b>${p.size}</b></div><div class="knob"><div class="dial"></div><span>Temperatura</span><b>Cold / Cold</b></div><div class="knob"><div class="dial"></div><span>Ciclo</span><b>${p.cycle}</b></div></div></div><div class="details"><div class="detail"><span>Extra Rinse</span><b>Off</b></div><div class="detail"><span>Detergente Kirkland</span><b>${p.powder}</b></div><div class="detail"><span>Secadora</span><b>${p.dc}</b></div><div class="detail"><span>Temperatura</span><b>${p.temp}</b></div><div class="detail"><span>Tiempo</span><b>${p.time}</b></div></div><p class="note"><b>${esc(p.names)}</b><br>${p.note}</p></article>`}
function historySave(split,plans){let h=read(HK,[]),snap=JSON.parse(JSON.stringify(S));h.unshift({id:Date.now(),date:new Date().toISOString(),state:snap,newItem:$('#newItem').checked,dirty:$('#dirty').checked,dryTogether:$('#dryTogether').checked,title:Object.values(snap).map(x=>`${x.qty} ${x.name}`).join(' · '),settings:split?`${plans.length} cargas separadas`: `${plans[0].size} · ${plans[0].cycle} · Cold/Cold`});localStorage.setItem(HK,JSON.stringify(h.slice(0,20)));historyRender()}
function historyRender(){let h=read(HK,[]);$('#history').innerHTML=h.length?h.map(x=>`<div class="history-item"><div><div class="history-title">${esc(x.title)}</div><div class="history-settings">${esc(x.settings)}</div><div class="history-meta">${new Date(x.date).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})}</div></div><div class="history-actions"><button data-repeat="${x.id}">Repetir</button><button class="delete" data-delete="${x.id}">×</button></div></div>`).join(''):'<div class="history-empty">Todavía no has calculado ninguna carga.</div>'}historyRender();$('#history').onclick=e=>{let h=read(HK,[]),id=+e.target.dataset.repeat||+e.target.dataset.delete;if(!id)return;if(e.target.dataset.repeat){let x=h.find(y=>y.id===id);loadState(x.state);$('#newItem').checked=x.newItem;$('#dirty').checked=x.dirty;$('#dryTogether').checked=x.dryTogether}else{localStorage.setItem(HK,JSON.stringify(h.filter(x=>x.id!==id)));historyRender()}};$('#clearHistory').onclick=()=>{if(confirm('¿Borrar todo el historial?')){localStorage.removeItem(HK);historyRender()}};
function calculate(){let a=Object.values(S),out=$('#results');if(!a.length){out.className='results show';out.innerHTML='<div class="warning">Agrega al menos una prenda.</div>';return}let g=new Set(a.map(x=>x.g)),split=g.has('heavy')&&(g.has('tech')||g.has('wool')||g.has('shirt')),t=$('#dryTogether').checked,plans=[],body='',banner='';if(split){let h=a.filter(x=>x.g==='heavy'),c=a.filter(x=>['tech','wool','shirt'].includes(x.g)),d=a.filter(x=>!h.includes(x)&&!c.includes(x));[h,c,d].filter(x=>x.length).forEach((x,i)=>{let p=plan(x,t);plans.push(p);body+=card(p,`Carga ${i+1}`,'split')});banner='<div class="warning"><b>Conviene dividir esta selección.</b> Los jeans pueden desgastar telas delicadas.</div>'}else{plans=[plan(a,t)];body=card(plans[0],'Una sola carga')}let prep=[...new Set(a.map(x=>x.prep)),'Separar colores; no usar suavizante.'];if($('#newItem').checked)prep.unshift('Lavar la prenda nueva separada durante 2 lavadas.');out.innerHTML=`<div class="result-head"><h2>Tu configuración</h2><span class="pill">${split?'Separación automática':'1 carga'}</span></div>${banner}<div class="grid">${body}<article class="card full"><h3>Antes de lavar</h3><ul>${prep.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article></div>`;out.className='results show';historySave(split,plans);out.scrollIntoView({behavior:'smooth'})}$('#calculate').onclick=calculate;
$('#results').after($('.history-panel'));
</script></body></html>
