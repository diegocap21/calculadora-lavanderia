<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de lavandería</title>
<style>
:root{--ink:#18362f;--muted:#71817b;--cream:#f7f2e8;--paper:#fffdf8;--green:#1d6a55;--mint:#dceee5;--terra:#e47e48;--line:#d9e0dc;--warn:#fff1da;--shadow:0 20px 55px rgba(24,54,47,.11)}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 0,#dfede6 0,transparent 31%),var(--cream)}body:before,body:after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:-1}body:before{width:250px;height:250px;right:-95px;top:90px;border:38px solid rgba(228,126,72,.09)}body:after{width:160px;height:160px;left:-70px;bottom:60px;background:rgba(29,106,85,.07)}.wrap{width:min(1080px,calc(100% - 28px));margin:auto;padding:38px 0 70px}header{display:flex;justify-content:space-between;align-items:end;gap:28px;margin-bottom:24px}.eyebrow{margin:0 0 8px;color:var(--green);font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{font:700 clamp(38px,6vw,66px)/.95 Georgia,serif;letter-spacing:-.045em;margin:0;max-width:720px}header>p{max-width:310px;margin:0;color:var(--muted)}.panel{position:relative;overflow:hidden;background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:25px;padding:22px;box-shadow:var(--shadow)}.panel:before{content:"WASH DAY";position:absolute;right:19px;top:10px;color:#a1aca7;font-size:9px;font-weight:900;letter-spacing:.22em}.toolbar{display:grid;grid-template-columns:1.5fr 1fr auto;gap:12px;margin-bottom:16px}label{display:block;margin:0 0 7px;font-size:13px;font-weight:800}input,select,button{font:inherit}select,input[type=number],input[type=text]{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:white;color:var(--ink);outline:none}select:focus,input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,106,85,.12)}button{border:0;border-radius:12px;cursor:pointer;font-weight:850}.add{height:46px;align-self:end;padding:0 20px;background:var(--mint);color:var(--green)}.items{display:grid;gap:9px}.empty{padding:28px;text-align:center;border:1px dashed #bccbc5;border-radius:16px;color:var(--muted)}.item{display:grid;grid-template-columns:1fr 88px 42px;gap:10px;align-items:center;padding:10px 10px 10px 15px;background:#fbfcf9;border:1px solid var(--line);border-radius:14px}.item strong,.item small{display:block}.item small{color:var(--muted)}.remove{width:40px;height:40px;background:transparent;color:#914d3c;font-size:22px}.custom,.favorites{display:grid;grid-template-columns:1fr 100px auto;gap:10px;margin-top:11px}.favorites{grid-template-columns:1fr auto auto}.custom button,.favorites button{padding:0 16px;background:#edf1ef;color:var(--ink)}.options{display:flex;gap:22px;flex-wrap:wrap;margin:20px 0}.check{display:flex;gap:9px;align-items:center;font-size:14px}.check input{width:18px;height:18px;accent-color:var(--green)}.calculate{width:100%;height:59px;background:var(--green);color:white;font-size:17px;box-shadow:0 10px 22px rgba(29,106,85,.22)}.calculate:hover{filter:brightness(.96)}.results{display:none;margin-top:22px}.results.show{display:block}.result-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px}.result-head h2{font:700 31px Georgia,serif;margin:0}.pill{padding:7px 12px;border-radius:99px;background:var(--mint);color:var(--green);font-size:12px;font-weight:850}.warning{margin-bottom:13px;padding:14px 16px;border-radius:14px;background:var(--warn);border:1px solid #efd4a7;color:#714924}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:17px;background:var(--paper);border:1px solid var(--line);border-radius:19px;transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(24,54,47,.08)}.full{grid-column:1/-1}.split{border-left:5px solid var(--terra)}.card h3{margin:0 0 13px;color:var(--green);font-size:13px;letter-spacing:.09em;text-transform:uppercase}.machine{padding:18px;margin-bottom:15px;border:1px solid #d1cabd;border-radius:18px;background:linear-gradient(145deg,#f5efe4,#e5dfd3);box-shadow:inset 0 2px #fff,0 8px 18px rgba(55,47,38,.1)}.machine-top{display:flex;justify-content:space-between;margin-bottom:15px;color:#77756c;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.on:before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#619c69;box-shadow:0 0 0 4px rgba(97,156,105,.15)}.knobs{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.knob{text-align:center}.dial{--turn:0deg;position:relative;width:92px;height:92px;margin:0 auto 9px;border:1px solid #b9b1a4;border-radius:50%;background:radial-gradient(circle at 36% 28%,#fff 0 8%,#eee8dd 40%,#cac2b5 72%,#9e978c 74%,#e5dfd4 79%);box-shadow:0 8px 12px rgba(55,47,38,.19),inset 0 2px 5px white}.knob:first-child .dial{--turn:-42deg}.knob:last-child .dial{--turn:42deg}.dial:before{content:"";position:absolute;z-index:2;width:3px;height:29px;left:calc(50% - 1px);top:9px;border-radius:4px;background:var(--terra);transform:rotate(var(--turn));transform-origin:50% 37px}.dial:after{content:"";position:absolute;inset:27px;border:1px solid #c6beb1;border-radius:50%;background:#e8e1d6}.knob span{display:block;color:#77756c;font-size:9px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.knob b{display:block;margin-top:2px;font-size:13px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.detail{padding:10px;border:1px solid #ded7ca;border-radius:11px;background:#fcfaf5}.detail span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.07em}.detail b{display:block;margin-top:2px;font-size:13px}.card ul{margin:0;padding-left:19px}.card li+li{margin-top:7px}.note{margin:13px 3px 0;color:var(--muted);font-size:13px}.split-title{margin:22px 0 10px;font:700 24px Georgia,serif}@media(max-width:700px){.wrap{padding-top:24px}header{display:block}header>p{margin-top:15px}.toolbar{grid-template-columns:1fr 85px}.toolbar .add{grid-column:1/-1}.grid{grid-template-columns:1fr}.full{grid-column:auto}.custom{grid-template-columns:1fr 80px}.custom button{grid-column:1/-1;height:44px}.favorites{grid-template-columns:1fr 1fr}.favorites select{grid-column:1/-1}.favorites button{height:44px}.panel{padding:15px}.item{grid-template-columns:1fr 72px 38px}}@media(max-width:500px){.knobs{gap:3px}.dial{width:72px;height:72px}.dial:before{height:22px;transform-origin:50% 29px}.dial:after{inset:21px}.details{grid-template-columns:1fr}.machine{padding:14px 9px}}
</style></head><body><main class="wrap"><header><div><p class="eyebrow">Tu guía Whirlpool</p><h1>¿Qué vas a lavar hoy?</h1></div><p>Agrega tus prendas y recibe una receta exacta de lavado y secado.</p></header><section class="panel"><div class="toolbar"><div><label for="garment">Prenda</label><select id="garment"></select></div><div><label for="qty">Cantidad</label><input id="qty" type="number" min="1" max="40" value="1"></div><button class="add" id="add">+ Agregar</button></div><div id="items" class="items"><div class="empty">Empieza agregando una prenda.</div></div><div class="custom"><input id="customName" type="text" placeholder="Otra prenda (opcional)"><input id="customQty" type="number" min="1" max="40" value="1"><button id="addCustom">Agregar otra</button></div><div class="favorites"><select id="favoriteList"><option value="">Cargas favoritas…</option></select><button id="loadFavorite">Cargar</button><button id="saveFavorite">☆ Guardar carga</button></div><div class="options"><label class="check"><input id="newItem" type="checkbox"> Hay una prenda nueva</label><label class="check"><input id="dirty" type="checkbox"> Muy sudada o sucia</label><label class="check"><input id="dryTogether" type="checkbox"> Secar todo junto</label></div><button id="calculate" class="calculate">Calcular settings</button></section><section id="results" class="results" aria-live="polite"></section></main>
<script>
const TYPES={cotton:{name:'Playera de algodón',hint:'Cualquier marca',w:1,g:'cotton',prep:['Voltear al revés si tiene estampado o color oscuro.']},hoodie:{name:'Sudadera de algodón',hint:'Con o sin capucha',w:2.2,g:'cotton',prep:['Voltear al revés; cerrar el cierre y aflojar cordones.']},uniqlo:{name:'Playera Uniqlo',hint:'Algodón / uso diario',w:1,g:'cotton',prep:['Voltear al revés, especialmente colores oscuros.']},carhartt:{name:'Playera Carhartt',hint:'Algodón pesado',w:1.3,g:'cotton',prep:['Voltear al revés; separar si es nueva.']},jersey:{name:'Jersey de fútbol',hint:'Tela técnica',w:.8,g:'tech',prep:['Voltear al revés para proteger números y logos.']},lululemon:{name:'Pantalón Lululemon',hint:'Tela técnica elástica',w:1.5,g:'tech',prep:['Voltear al revés y cerrar cierres.']},quandary:{name:'Patagonia Quandary',hint:'Nylon / elastano',w:1.4,g:'tech',prep:['Voltear al revés; cerrar cierres, botones y velcros.']},jeans:{name:'Jeans',hint:'Mezclilla pesada',w:2.5,g:'heavy',prep:['Voltear al revés y cerrar cierre y botón.']},underwear:{name:'Ropa interior',hint:'Algodón o sintética',w:.45,g:'light',prep:['Cerrar ganchos o cierres, si existen.']},merino:{name:'Calcetines de merino',hint:'Lana merino',w:.38,g:'wool',prep:['Voltear al revés si la etiqueta lo recomienda.']},shirts:{name:'Camisa de cuello / Brooks Brothers',hint:'Algodón o non-iron',w:1.1,g:'shirt',prep:['Desabrochar botones y retirar collarines removibles.','Separar de jeans y prendas con cierres.']}};
const state={},$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));Object.entries(TYPES).forEach(([k,v])=>$('#garment').add(new Option(v.name,k)));
function render(){const rows=Object.entries(state);$('#items').innerHTML=rows.length?rows.map(([k,x])=>`<div class="item"><div><strong>${esc(x.name)}</strong><small>${esc(x.hint)}</small></div><input type="number" min="1" max="40" value="${x.qty}" data-qty="${esc(k)}"><button class="remove" data-remove="${esc(k)}">×</button></div>`).join(''):'<div class="empty">Empieza agregando una prenda.</div>'}
function add(k,q){q=Math.max(1,Math.min(40,+q||1));if(state[k])state[k].qty+=q;else state[k]={...(TYPES[k]||{name:k.slice(7),hint:'Prenda personalizada',w:1,g:'custom',prep:['Revisar la etiqueta antes de lavar.']}),qty:q};render()}
$('#add').onclick=()=>{add($('#garment').value,$('#qty').value);$('#qty').value=1};$('#addCustom').onclick=()=>{const n=$('#customName').value.trim();if(n){add('custom:'+n,$('#customQty').value);$('#customName').value='';$('#customQty').value=1}};$('#items').onclick=e=>{if(e.target.dataset.remove){delete state[e.target.dataset.remove];render()}};$('#items').onchange=e=>{if(e.target.dataset.qty)state[e.target.dataset.qty].qty=Math.max(1,+e.target.value||1)};
const FK='lavanderia-favoritas-v1';function favs(){try{return JSON.parse(localStorage.getItem(FK)||'{}')}catch{return {}}}function renderFav(){const f=favs();$('#favoriteList').innerHTML='<option value="">Cargas favoritas…</option>'+Object.keys(f).sort().map(n=>`<option>${esc(n)}</option>`).join('')}renderFav();$('#saveFavorite').onclick=()=>{if(!Object.keys(state).length)return alert('Agrega prendas primero.');const n=prompt('Nombre de esta carga:');if(n&&n.trim()){const f=favs();f[n.trim()]=state;localStorage.setItem(FK,JSON.stringify(f));renderFav()}};$('#loadFavorite').onclick=()=>{const s=favs()[$('#favoriteList').value];if(s){Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,JSON.parse(JSON.stringify(s)));render()}};
function dose(size,liquid,dirty,merino){if(liquid){if(merino)return dirty?'2 cucharadas (30 mL)':'1 cucharada (15 mL)';return size==='Small'?'1 cucharada (15 mL)':size==='Medium'?(dirty?'2 cucharadas (30 mL)':'1½–2 cucharadas (20–30 mL)'):'2 cucharadas (30 mL)'}return size==='Small'?'½ cuchara':size==='Medium'?'¾ de cuchara':'1 cuchara'}
function plan(a,together){const score=a.reduce((s,x)=>s+x.w*x.qty,0),size=score<=7?'Small':score<=18?'Medium':'Large',gs=new Set(a.map(x=>x.g)),has=g=>gs.has(g),tech=has('tech')||has('wool'),heavy=has('heavy'),shirt=has('shirt'),merino=has('wool'),dirty=$('#dirty').checked;let cycle=tech?'Delicates 6':heavy&&!has('cotton')&&!shirt?'Regular 6':'Permanent Press 6',dc='Knits',temp='Low',time=size==='Small'?'30–40 min':size==='Medium'?'40–50 min':'45–55 min',note='Sacar al terminar para reducir arrugas.';if(tech){dc='Delicate';temp='Ex Low';time='20–30 min';note=together?'Usa el ajuste más delicado y retira lo que seque antes.':'Ideal: colgar las prendas técnicas y merino.'}if(shirt&&!tech){time='10–15 min';note='Colgar inmediatamente para terminar de secar.'}if(heavy&&!tech&&!shirt){time='35–40 min';note='Para reducir desgaste, terminar colgados.'}return{size,cycle,dc,temp,time,note,merino,powder:dose(size,0,dirty,merino),liquid:dose(size,1,dirty,merino),names:a.map(x=>`${x.qty} ${x.name}`).join(' · ')}}
function card(p,title,split=''){return `<article class="card full ${split}"><h3>${esc(title)}</h3><div class="machine"><div class="machine-top"><span>Whirlpool · guía de ciclo</span><span class="on">Lista</span></div><div class="knobs"><div class="knob"><div class="dial"></div><span>Load Size</span><b>${p.size}</b></div><div class="knob"><div class="dial"></div><span>Temperatura</span><b>Cold / Cold</b></div><div class="knob"><div class="dial"></div><span>Ciclo</span><b>${p.cycle}</b></div></div></div><div class="details"><div class="detail"><span>Extra Rinse</span><b>Off</b></div><div class="detail"><span>Kirkland</span><b>${p.powder}</b></div><div class="detail"><span>Mas Bebé</span><b>${p.liquid}</b></div><div class="detail"><span>Secadora</span><b>${p.dc}</b></div><div class="detail"><span>Temperatura</span><b>${p.temp}</b></div><div class="detail"><span>Tiempo</span><b>${p.time}</b></div></div><p class="note"><b>${esc(p.names)}</b><br>${esc(p.note)} ${p.merino?'Preferencia: Mas Bebé líquido.':'Usa solo un detergente.'}</p></article>`}
function calculate(){const a=Object.values(state),out=$('#results');if(!a.length){out.className='results show';out.innerHTML='<div class="warning">Agrega al menos una prenda.</div>';return}const gs=new Set(a.map(x=>x.g)),split=gs.has('heavy')&&(gs.has('tech')||gs.has('wool')||gs.has('shirt')),together=$('#dryTogether').checked;let body='',banner='';if(split){const h=a.filter(x=>x.g==='heavy'),c=a.filter(x=>['tech','wool','shirt'].includes(x.g)),d=a.filter(x=>!h.includes(x)&&!c.includes(x));banner='<div class="warning"><b>Conviene dividir esta selección.</b> Los jeans pueden desgastar telas técnicas, lana y camisas.</div><h3 class="split-title">Plan recomendado</h3>';body+=card(plan(h,together),'Carga 1 · Jeans','split');if(c.length)body+=card(plan(c,together),'Carga 2 · Prendas delicadas','split');if(d.length)body+=card(plan(d,together),'Carga 3 · Ropa diaria','split')}else body=card(plan(a,together),'Una sola carga');const prep=[...new Set(a.flatMap(x=>x.prep)),'Separar colores claros y oscuros; no usar suavizante.'];if($('#newItem').checked)prep.unshift('Lavar la prenda nueva separada durante sus primeras 2 lavadas.');out.innerHTML=`<div class="result-head"><h2>Tu configuración</h2><span class="pill">${split?'Separación automática':'1 carga'}</span></div>${banner}${together?'<div class="warning">Secado conjunto: usa el ajuste de la prenda más delicada y revisa a mitad del ciclo.</div>':''}<div class="grid">${body}<article class="card full"><h3>Antes de lavar</h3><ul>${prep.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article></div><p class="note">La etiqueta de cada prenda siempre tiene prioridad.</p>`;out.className='results show';out.scrollIntoView({behavior:'smooth'})}$('#calculate').onclick=calculate;
</script></body></html>
